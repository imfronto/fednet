global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'pihole'
    static_configs:
      - targets: ['pihole-exporter:9617']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      # node-exporter runs with network_mode: host (services/monitoring.yml),
      # not on the edge bridge, so it's no longer reachable by container
      # name — host.docker.internal is this container's own extra_hosts
      # entry pointing at the host gateway.
      - targets: ['host.docker.internal:9100']
