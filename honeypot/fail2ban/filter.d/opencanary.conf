[Definition]
# OpenCanary logs one JSON object per line (opencanary.conf's PyLogger,
# see honeypot/opencanary.conf). Every real probe carries a populated
# src_host; the container's own startup/service-registration lines
# ("Added service from class...") have src_host: "" and simply never
# match an IP-shaped <HOST>, so they don't need excluding explicitly.
failregex = ^.*"src_host":\s*"<HOST>".*$
ignoreregex =
