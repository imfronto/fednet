[opencanary]
enabled = true
filter = opencanary
logpath = /var/log/honeypot/opencanary.log
# ignoreip covers loopback and Docker's own bridge ranges (edge is
# 172.19.0.0/16, honeypot_net is 172.20.0.0/16 — both fall inside
# 172.16.0.0/12) so a container-to-container test never gets banned.
# The real LAN (192.168.1.0/24) is deliberately NOT ignored — per the
# honeypot's own README, a LAN-sourced hit is exactly the threat this
# exists to catch (a compromised device or malicious guest).
ignoreip = 127.0.0.1/8 172.16.0.0/12
# maxretry=1: this repo's own README already treats a single touch as
# inherently suspicious ("nothing legitimate on this LAN ever has a
# reason to touch these ports") — there's no "probably an accident"
# tier to wait out the way there is for a real SSH server's login
# attempts.
maxretry = 1
findtime = 86400
# 24h, not permanent: this is the first automated-response layer this
# stack has had (everything before this only alerts). A bounded ban
# limits the blast radius of a false positive while this proves itself
# out; extend to a longer bantime or -1 (permanent) once confident.
bantime = 86400
action = iptables-allports[name=opencanary]
