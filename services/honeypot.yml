networks:
  edge:
    external: true
  # Deliberately NOT the shared edge network: Docker only routes between
  # containers on the *same* network, so honeypot has no path to Pi-hole,
  # Portainer, Grafana, etc. even if fully compromised. (internal:true
  # was tried here first and reverted — it also blocks Docker's own
  # port-publishing, which silently made the honeypot unreachable from
  # the LAN entirely, defeating the point. Verified with `docker port`
  # and a direct connection test before catching it.)
  honeypot_net: {}

services:
  honeypot:
    image: thinkst/opencanary:latest@sha256:c374c68b3e0f6b362baa00d6ba5ae4ad8e946383521482c6780b075c7ab41640
    container_name: honeypot
    restart: unless-stopped
    networks: [honeypot_net]
    # The one container built to face hostile input previously had the
    # least hardening of any in this stack (default capabilities, root,
    # writable rootfs) — network isolation was the only layer behind it.
    # All three add-backs were found by testing, not guessed: NET_BIND_SERVICE
    # to bind the three privileged ports (21, 22, 23); SETUID/SETGID because
    # OpenCanary's own startup binds as root then drops to uid/gid 65534 —
    # cap_drop: ALL alone made that drop fail ("Operation not permitted"),
    # crash-looping the container. no-new-privileges was tried and reverted:
    # it made every exec of the venv's own opencanaryd fail outright, most
    # likely because the binary relies on a file capability that
    # no-new-privileges specifically blocks the kernel from honoring.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /run
    ports:
      # Classic scan/bot bait — all unused on this host (verified against
      # `ss -tln` before adding). Real sshd already owns the host's :22,
      # so the decoy publishes on :2222 instead — untouched at the
      # container/compose layer. It only sees traffic if something
      # upstream (the router) is pointed at :2222 for external :22;
      # real remote SSH should go over Tailscale, not a second
      # forwarded port, or this defeats the point of decoying :22.
      - "21:21"     # FTP
      - "23:23"     # Telnet
      - "3306:3306" # MySQL
      - "6379:6379" # Redis
      - "27017:27017" # MongoDB
      - "2222:22"   # SSH decoy (see comment above)
    volumes:
      - ./honeypot/opencanary.conf:/root/.opencanary.conf:ro
      - ./data/honeypot:/var/tmp
    healthcheck:
      # No HTTP endpoint to probe (it's FTP/Telnet/MySQL/Redis/Mongo bait,
      # not a web service) — checking the opencanaryd/twistd process is
      # alive instead.
      test: ["CMD", "pgrep", "-f", "opencanary"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  honeypot-watchdog:
    build: ./watchdog-base
    image: fednet/watchdog-base:1
    container_name: honeypot-watchdog
    restart: unless-stopped
    networks: [edge]
    entrypoint: ["/bin/sh", "/honeypot_watchdog.sh"]
    environment:
      # Resolved in honeypot_watchdog.sh, not here — Compose's own
      # interpolation doesn't support nesting a second ${VAR} inside a
      # :- default the way a real shell does.
      - HONEYPOT_WEBHOOK_URL=${HONEYPOT_WEBHOOK_URL:-}
      - GRAVITY_WEBHOOK_URL=${GRAVITY_WEBHOOK_URL:?set GRAVITY_WEBHOOK_URL in .env}
      - HONEYPOT_BURST_THRESHOLD=${HONEYPOT_BURST_THRESHOLD:-10}
      - HONEYPOT_BURST_WINDOW_SECONDS=${HONEYPOT_BURST_WINDOW_SECONDS:-60}
      - HONEYPOT_BURST_COOLDOWN_SECONDS=${HONEYPOT_BURST_COOLDOWN_SECONDS:-300}
    volumes:
      - ./data/honeypot:/data/honeypot:ro
      - ./scripts/honeypot_watchdog.sh:/honeypot_watchdog.sh:ro
    depends_on:
      - honeypot
    # Only local write is its own burst-detection state under /tmp
    # (probe_times, last_burst_alert) — a tmpfs covers that; everything
    # else is reads and outbound curl calls.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "pgrep", "-f", "honeypot_watchdog.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  honeypot-fail2ban:
    # Turns the honeypot's existing detection into an actual response.
    # Originally scoped against Portainer's login attempts, but Portainer
    # CE logs no source IP for a failed login even at DEBUG (verified
    # directly, including against a disposable non-live instance before
    # touching anything real) — there's nothing there to ban. Redirected
    # to the honeypot instead: every real probe includes src_host, and
    # this repo's own README already treats any touch as inherently
    # suspicious, which is exactly Fail2ban's assumption for a
    # maxretry=1 jail (see honeypot/fail2ban/jail.d/opencanary.conf).
    image: crazymax/fail2ban:latest@sha256:2bc26b68f373ce6e52bbd181de2937a6694f72b74ddf15bbd1b25e90553dcda3
    container_name: honeypot-fail2ban
    restart: unless-stopped
    # Host networking + NET_ADMIN/NET_RAW are unavoidable here, unlike
    # every other container in this stack — actually banning an IP means
    # manipulating the host's real netfilter tables, not a namespaced
    # per-container one. This is the one deliberate exception to this
    # repo's container-isolation posture, taken on because the whole
    # point is host-level enforcement; it has no path to Pi-hole,
    # Portainer, or anything else this stack isolates the honeypot from.
    network_mode: host
    # Stays root (crazymax/fail2ban does no internal privilege drop,
    # confirmed via `docker exec ... whoami`), but cap_drop: [ALL] still
    # narrows it from Docker's full default set down to exactly what it
    # uses: NET_ADMIN/NET_RAW for real iptables manipulation. No DAC_OVERRIDE
    # needed — every mounted path it reads or writes (jail.d, filter.d,
    # /var/log/honeypot, its own /data) is either world-readable or
    # root-owned, so root's normal (non-capability-gated) permission match
    # already covers it, confirmed via `ls -la` before relying on it rather
    # than adding the capability speculatively.
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - TZ=${TZ:-UTC}
      - F2B_LOG_LEVEL=INFO
      - F2B_DB_PURGE_AGE=30d
    volumes:
      - ./honeypot/fail2ban/jail.d:/data/jail.d:ro
      - ./honeypot/fail2ban/filter.d:/data/filter.d:ro
      - ./data/honeypot:/var/log/honeypot:ro
      - ./data/honeypot-fail2ban:/data
      # Coordinates with Docker's own iptables usage on this host so the
      # two never corrupt each other's rule updates mid-write.
      - /var/run/xtables.lock:/var/run/xtables.lock:rw
    depends_on:
      - honeypot
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
