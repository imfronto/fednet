networks:
  edge:
    external: true

services:
  jellyfin:
    image: jellyfin/jellyfin:latest@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: jellyfin
    restart: unless-stopped
    networks: [edge]
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Stays root: config/cache are already root-owned — switching uid
    # would need chowning live Jellyfin state first, a real risk for
    # marginal benefit over capability restriction alone.
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          # Generous CPU ceiling: software transcoding (no GPU on this
          # host, see below) is the one workload here that can legitimately
          # need several cores at once.
          memory: 2G
          cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      # Read-only: Jellyfin only needs to read your library, and this
      # keeps a metadata-scan bug or bad plugin from being able to touch
      # the actual files. Drop `:ro` if you want it to save extracted
      # subtitles/artwork back into the media folders instead of its own
      # /config/metadata.
      - ./data/jellyfin/media:/media:ro
      # No GPU passthrough: this host's CPU (Xeon E5-2407) has no
      # integrated GPU, so hardware transcoding has nothing to attach to
      # — every transcode falls back to (slower) software encoding via
      # ffmpeg. If the host ever gets an Intel/AMD GPU, add
      # `/dev/dri:/dev/dri` here and enable VAAPI in Jellyfin's
      # Playback settings.
