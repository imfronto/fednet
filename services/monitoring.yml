networks:
  edge:
    external: true

volumes:
  pihole_grafana_data:
    external: true
  pihole_prometheus_data:
    external: true

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: uptime-kuma
    restart: unless-stopped
    networks: [edge]
    ports:
      - "3001:3001"
    volumes:
      - ./data/uptime-kuma:/app/data
    # Stays root: kuma.db and its WAL files are already root-owned,
    # rwxr-xr-x (no group/other write) — switching uid would need
    # chown-ing a live, actively-written SQLite database first, a real
    # corruption risk for marginal benefit over capability restriction
    # alone (DAC checks don't apply to root regardless).
    # SETUID/SETGID needed too: its own entrypoint runs `setpriv` to
    # manage its own groups at startup (same "app does its own
    # privilege drop" pattern as OpenCanary) — cap_drop: ALL alone
    # made that fail ("setgroups failed: Operation not permitted").
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    restart: unless-stopped
    networks: [edge]
    ports:
      - "9090:9090"
    # Lets prometheus reach node-exporter's host-level metrics via a
    # stable name instead of a fragile hardcoded bridge-gateway IP.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pihole_prometheus_data:/prometheus
    # Already non-root by the image's own default (Phase 6). TSDB writes
    # go to the named volume, not rootfs, so read_only doesn't touch them.
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    container_name: grafana
    restart: unless-stopped
    networks: [edge]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    # Root only to let theme-entrypoint.sh patch index.html at startup;
    # it drops to grafana's normal uid (472) via su before running the
    # actual server. No read_only here, deliberately: that patch is a
    # sed -i against a file baked into the image itself, not a bind
    # mount — a read-only rootfs would break the one thing this
    # container's root access exists for. SETUID/SETGID kept for the
    # su step itself (same pattern as the honeypot/pihole/others).
    user: "0:0"
    # DAC_OVERRIDE also needed: even at uid 0, root loses its usual
    # bypass-any-permission-check power without this specific
    # capability — sed -i's temp-file-in-directory step failed
    # ("Permission denied") without it, despite still running as root.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    entrypoint: ["/bin/sh", "/theme-entrypoint.sh"]
    volumes:
      - pihole_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/theme-entrypoint.sh:/theme-entrypoint.sh:ro
      - ./grafana/custom.css:/usr/share/grafana/public/fednet-custom.css:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  loki:
    image: grafana/loki:latest@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    container_name: loki
    restart: unless-stopped
    networks: [edge]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    # Already non-root by the image's own default (uid 10001, Phase 6).
    # Storage writes go to the bind-mounted /loki, not rootfs.
    cap_drop:
      - ALL
    read_only: true
    # No compose-level healthcheck: this image ships no shell and no
    # curl/wget/nc (checked directly — exec into it fails even for `ls`),
    # so there's no in-container way to probe its /ready endpoint.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  promtail:
    image: grafana/promtail:latest@sha256:6cfa64ec432b24a912d640e2edb940eeae2666f61861a66c121d763dd7241381
    container_name: promtail
    restart: unless-stopped
    networks: [edge]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./data/honeypot:/var/log/honeypot:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    # Needs a writable /tmp for its own positions.yaml (tracks read
    # offset per log file so a restart doesn't reprocess everything) —
    # promtail-config.yml points it there, found by checking rather
    # than assuming a stateless exporter shape like the other watchdogs.
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # No curl/wget/nc in this image either — process check instead.
      test: ["CMD", "pgrep", "-f", "promtail"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  gravity-watchdog:
    build: ./watchdog-base
    image: fednet/watchdog-base:1
    container_name: gravity-watchdog
    restart: unless-stopped
    networks: [edge]
    entrypoint: ["/bin/sh", "/gravity_watchdog.sh"]
    environment:
      - MAX_AGE_HOURS=${GRAVITY_MAX_AGE_HOURS:-48}
      - CHECK_INTERVAL_SECONDS=3600
      - WEBHOOK_URL=${GRAVITY_WEBHOOK_URL:?set GRAVITY_WEBHOOK_URL in .env}
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole:ro
      - ./scripts/gravity_watchdog.sh:/gravity_watchdog.sh:ro
    depends_on:
      - pihole
    # Reads gravity.db (world-readable, :ro anyway) and makes outbound
    # curl calls — no local writes, no privileged ports, no reason to
    # be root or hold any capability.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "pgrep", "-f", "gravity_watchdog.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pihole-flood-watchdog:
    build: ./watchdog-base
    image: fednet/watchdog-base:1
    container_name: pihole-flood-watchdog
    restart: unless-stopped
    networks: [edge]
    entrypoint: ["/bin/sh", "/pihole_flood_watchdog.sh"]
    environment:
      # Resolved inside the script itself (same reason as
      # honeypot_watchdog.sh): Compose's interpolation doesn't support
      # nesting a second ${VAR} inside a :- default.
      - PIHOLE_FLOOD_WEBHOOK_URL=${PIHOLE_FLOOD_WEBHOOK_URL:-}
      - GRAVITY_WEBHOOK_URL=${GRAVITY_WEBHOOK_URL:?set GRAVITY_WEBHOOK_URL in .env}
      - PIHOLE_CLIENT_FLOOD_THRESHOLD=${PIHOLE_CLIENT_FLOOD_THRESHOLD:-600}
      - PIHOLE_TOTAL_FLOOD_THRESHOLD=${PIHOLE_TOTAL_FLOOD_THRESHOLD:-4000}
      - PIHOLE_FLOOD_COOLDOWN_SECONDS=${PIHOLE_FLOOD_COOLDOWN_SECONDS:-1800}
      - CHECK_INTERVAL_SECONDS=60
    volumes:
      - ./scripts/pihole_flood_watchdog.sh:/pihole_flood_watchdog.sh:ro
    depends_on:
      - prometheus
      - pihole-exporter
    # Queries Prometheus and posts webhooks — no local writes, no
    # privileged ports, no reason to be root or hold any capability.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole_flood_watchdog.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pihole-stats-digest:
    build: ./watchdog-base
    image: fednet/watchdog-base:1
    container_name: pihole-stats-digest
    restart: unless-stopped
    networks: [edge]
    entrypoint: ["/bin/sh", "/pihole_stats_digest.sh"]
    environment:
      - PIHOLE_PASSWORD=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      - PIHOLE_STATS_WEBHOOK_URL=${PIHOLE_STATS_WEBHOOK_URL:-}
      - GRAVITY_WEBHOOK_URL=${GRAVITY_WEBHOOK_URL:?set GRAVITY_WEBHOOK_URL in .env}
      - PIHOLE_STATS_TOP_COUNT=${PIHOLE_STATS_TOP_COUNT:-5}
      - PIHOLE_STATS_INTERVAL_SECONDS=${PIHOLE_STATS_INTERVAL_SECONDS:-3600}
    volumes:
      - ./scripts/pihole_stats_digest.sh:/pihole_stats_digest.sh:ro
    depends_on:
      - pihole
    # Calls Pi-hole's API and posts webhooks — no local writes, no
    # privileged ports, no reason to be root or hold any capability.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole_stats_digest.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: cadvisor
    restart: unless-stopped
    networks: [edge]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      # Docker itself is the snap package on this host (Docker Root Dir
      # is /var/snap/docker/..., not the usual /var/lib/docker) — the
      # standard cAdvisor tutorial mount would silently point at an empty
      # directory here.
      - /var/snap/docker/common/var-lib-docker:/var/lib/docker:ro
    # Stays root: cAdvisor introspects other containers' cgroups.
    # Confirmed by testing that dropping all capabilities doesn't
    # change its metric output either way (container-name labeling was
    # already absent even in the fully unhardened config — a
    # pre-existing snap-Docker cgroup-naming quirk, not something this
    # change caused), so there's no functional cost to restricting it.
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  node-exporter:
    image: prom/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    # Host networking, not the edge bridge: on the bridge, node-exporter
    # can only see its own container's eth0/lo, so node_network_* metrics
    # never reflect the host's real interfaces (eno1, tailscale0). This
    # trades that blind spot for the same cost bambuddy already carries —
    # node-exporter's :9100 is now reachable from the LAN directly (and
    # pending the still-open IPv6 firewall question, potentially further
    # than that), not just from containers on edge. Prometheus already
    # had `host.docker.internal:host-gateway` wired up for exactly this
    # (see its own service block) — only the scrape target itself
    # (prometheus/prometheus.yml) needed to catch up.
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    # Already non-root by the image's own default (uid 65534, Phase 6).
    # Purely reads /proc, /sys, /rootfs (all :ro) and serves metrics —
    # no writable path needed anywhere.
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
