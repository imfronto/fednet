networks:
  edge:
    external: true

services:
  pihole:
    image: pihole/pihole:latest@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: pihole
    restart: unless-stopped
    networks: [edge]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      - TZ=${TZ:-UTC}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    # Second attempt, evidence-based rather than guessed: read the actual
    # entrypoint chain inside the running image (start.sh, bash_functions.sh's
    # fix_capabilities(), pihole-FTL-prestart.sh) instead of trial-and-error.
    # Root cause of the earlier revert: CAP_CHOWN was missing from cap_add,
    # so pihole-FTL-prestart.sh's `install -o pihole -g pihole /run/pihole-FTL.pid`
    # — a file recreated from scratch on every start, since /run isn't a
    # persistent volume, unlike /etc/pihole — silently failed to set
    # ownership. FTL then starts as uid 1000 (via `capsh --user=pihole
    # --keep=1`, confirmed live: PID 1/start.sh stays root, the FTL process
    # itself runs as pihole:pihole) and can't write its own pidfile, which
    # broke DNS while the healthcheck (HTTP-only, :80) stayed green. CAP_NET_RAW
    # was also missing, so fix_capabilities()'s own `capsh --has-p` probe
    # skipped granting it as a file capability on the FTL binary. This set
    # keeps every capability the image's own scripts demonstrably touch and
    # drops only the four Docker-default capabilities nothing in pihole/FTL's
    # source ever references: AUDIT_WRITE, MKNOD, SYS_CHROOT, FSETID.
    # read_only deliberately not attempted in this pass — /run and
    # /var/log/pihole are plain rootfs here (confirmed via /proc/mounts),
    # not bind mounts, so that needs its own tmpfs step and its own
    # verification, not stacked with this one.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - SETFCAP
      - NET_BIND_SERVICE
      - NET_RAW
      - NET_ADMIN
    # read_only: attempted twice, reverted both times — this is a structural
    # incompatibility, not a missing-tmpfs-entry problem. `docker logs`
    # (captured on the second attempt) shows the fatal one: fix_capabilities()
    # runs `setcap ... /usr/bin/pihole-FTL` on every single startup, writing
    # an xattr onto the FTL binary itself, which lives on the image's own
    # rootfs layer — "Failed to set capabilities on file
    # '/usr/bin/pihole-FTL': Read-only file system", followed by the
    # script's own "Cannot run as non-root" error and exit. No tmpfs mount
    # fixes that; it would need the binary's directory itself writable,
    # defeating the point. Two more non-fatal errors in the same log
    # confirm the image assumes a fully writable rootfs by design: a
    # `chown` on `/macvendor.db` (image root, not persisted) and cron's
    # own `sed`/`crontab` writing a temp file relative to `/`. Fixing this
    # for real means patching the entrypoint or baking setcap into a custom
    # image at build time instead of runtime — out of scope for a
    # compose-only hardening pass. Left unset; the capability reduction
    # above stands on its own and doesn't depend on this.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pihole-exporter:
    image: ghcr.io/mosher-labs/pihole6-exporter:latest@sha256:40cccbe332ef8f3b30423b10853fb84cfb4e7613c57717943bc58276990bb085
    container_name: pihole-exporter
    restart: unless-stopped
    networks: [edge]
    command: ["-H", "pihole", "--pihole-port", "80", "--protocol", "http"]
    environment:
      - PIHOLE_API_TOKEN=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    depends_on:
      - pihole
    # Stateless: reads Pi-hole's API, serves metrics — no local writes,
    # no privileged ports, no reason to be root or hold any capability.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9617/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
