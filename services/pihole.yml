networks:
  edge:
    external: true

services:
  pihole:
    # Built locally instead of pulled — see pihole/Dockerfile. Bakes the
    # same file capabilities this service's cap_add already grants onto
    # the pihole-FTL binary at build time, so the base image's own
    # fix_capabilities() doesn't need to repeat that write (setcap) at
    # every container start, which is what read_only below would
    # otherwise block. Still pinned by the same digest the image: line
    # used to carry, and still tracked by Renovate — it scans Dockerfile
    # FROM lines for digest updates independently of the docker-compose
    # file patterns configured in renovate.json.
    build: ./pihole
    container_name: pihole
    restart: unless-stopped
    networks: [edge]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      - TZ=${TZ:-UTC}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      # Skips ftl_config()'s own runtime `chown pihole:pihole /macvendor.db`
      # (image rootfs, blocked by read_only below) by short-circuiting the
      # `-z "${FTLCONF_files_macvendor:-}"` guard that call sits behind.
      # The image already ships this file owned by pihole:pihole at build
      # time (verified with `getcap`/`ls -la` before relying on it), so
      # the runtime chown was always a no-op — this just stops it from
      # being attempted.
      - FTLCONF_files_macvendor=/macvendor.db
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    # Second attempt, evidence-based rather than guessed: read the actual
    # entrypoint chain inside the running image (start.sh, bash_functions.sh's
    # fix_capabilities(), pihole-FTL-prestart.sh) instead of trial-and-error.
    # Root cause of the earlier revert: CAP_CHOWN was missing from cap_add,
    # so pihole-FTL-prestart.sh's `install -o pihole -g pihole /run/pihole-FTL.pid`
    # — a file recreated from scratch on every start, since /run isn't a
    # persistent volume, unlike /etc/pihole — silently failed to set
    # ownership. FTL then starts as uid 1000 (via `capsh --user=pihole
    # --keep=1`, confirmed live: PID 1/start.sh stays root, the FTL process
    # itself runs as pihole:pihole) and can't write its own pidfile, which
    # broke DNS while the healthcheck (HTTP-only, :80) stayed green. CAP_NET_RAW
    # was also missing, so fix_capabilities()'s own `capsh --has-p` probe
    # skipped granting it as a file capability on the FTL binary. This set
    # keeps every capability the image's own scripts demonstrably touch and
    # drops only the four Docker-default capabilities nothing in pihole/FTL's
    # source ever references: AUDIT_WRITE, MKNOD, SYS_CHROOT, FSETID.
    # read_only deliberately not attempted in this pass — /run and
    # /var/log/pihole are plain rootfs here (confirmed via /proc/mounts),
    # not bind mounts, so that needs its own tmpfs step and its own
    # verification, not stacked with this one.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
      - SETFCAP
      - NET_BIND_SERVICE
      - NET_RAW
      - NET_ADMIN
    # read_only: third pass, now working — closed by building a custom
    # image (pihole/Dockerfile) instead of trying to make the base image's
    # own runtime writes fit read_only, which the previous two attempts
    # showed is structurally impossible: fix_capabilities() unconditionally
    # `setcap`s the FTL binary on every start, an xattr write against the
    # image's own rootfs layer that no tmpfs mount can satisfy. The
    # Dockerfile bakes that same capability set at build time instead, and
    # overrides fix_capabilities() so the now-redundant runtime setcap
    # failing under read_only is treated as expected (verified against
    # getcap, not assumed) rather than fatal.
    #
    # Two more real writes from the same incident's log needed their own
    # fix: `chown pihole:pihole /macvendor.db` is skipped via the
    # FTLCONF_files_macvendor env var above; the tmpfs entries below cover
    # /run and /var/log/pihole, which are plain rootfs in this image, not
    # bind mounts. One write is deliberately left broken rather than
    # patched: start_cron()'s `sed -i` randomization of /crontab.txt lives
    # at container root, which stays read-only by design — tmpfs-ing `/`
    # would defeat the point. Confirmed non-fatal in isolated testing (no
    # `set -o errtrace` in start.sh, so a failure inside a sourced function
    # doesn't trip its own `trap ... ERR`): cron installs successfully with
    # its static default times instead of randomized ones, which only
    # matters for avoiding synchronized load across many Pi-hole instances
    # — irrelevant with the one instance this homelab runs. /etc/crontabs
    # is tmpfs'd below so the `crontab` install itself (a separate write
    # from the sed call, resolved through the /var/spool/cron/crontabs ->
    # /etc/crontabs symlink) still succeeds.
    #
    # Tested end-to-end in an isolated container on a private network
    # before touching the live service: fresh boot (gravity DB creation)
    # and a warm restart (existing DB) both start clean at zero restarts;
    # real DNS resolution and ad-blocking verified via `dig`, not just
    # container health; `touch /` confirmed read_only is genuinely
    # enforced, not silently ignored; FTL's actual runtime capability set
    # (via /proc/<pid>/status) matches exactly what the capability-only
    # pass already verified live (CHOWN/NET_BIND_SERVICE/NET_ADMIN/NET_RAW).
    read_only: true
    tmpfs:
      - /run
      - /var/log/pihole
      - /etc/crontabs
      - /tmp
    healthcheck:
      # The web-UI-only check above missed the real incident documented
      # above: FTL's DNS engine was dead while :80 stayed up. `pi.hole` is
      # FTL's own built-in local A record (confirmed live: resolves to
      # 127.0.0.1 regardless of upstream/internet reachability), so this
      # actually exercises the DNS engine on :53 in addition to the web UI,
      # without depending on anything outside the container.
      test: ["CMD-SHELL", "dig +time=2 +tries=1 @127.0.0.1 pi.hole >/dev/null && wget --no-verbose --tries=1 --spider http://localhost/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pihole-exporter:
    image: ghcr.io/mosher-labs/pihole6-exporter:latest@sha256:40cccbe332ef8f3b30423b10853fb84cfb4e7613c57717943bc58276990bb085
    container_name: pihole-exporter
    restart: unless-stopped
    networks: [edge]
    command: ["-H", "pihole", "--pihole-port", "80", "--protocol", "http"]
    environment:
      - PIHOLE_API_TOKEN=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    depends_on:
      - pihole
    # Stateless: reads Pi-hole's API, serves metrics — no local writes,
    # no privileged ports, no reason to be root or hold any capability.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9617/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
