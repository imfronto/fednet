networks:
  edge:
    external: true

services:
  pihole:
    image: pihole/pihole:latest@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: pihole
    restart: unless-stopped
    networks: [edge]
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      - TZ=${TZ:-UTC}
      - FTLCONF_webserver_api_password=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    volumes:
      - ./data/pihole/etc-pihole:/etc/pihole
      - ./data/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    # Reverted: cap_drop: ALL (even with NET_ADMIN/NET_BIND_SERVICE/
    # SETUID/SETGID/SETPCAP/SETFCAP all added back one error at a time)
    # got FTL's own capability self-management working, but actual DNS
    # resolution on :53 then failed outright ("connection refused") —
    # likely FTL successfully dropping to a low-priv internal user for
    # the first time (previously that drop silently failed and stayed
    # root) and landing somewhere without access to its own log/run
    # paths. This is the sharpest SPOF in the whole stack (Phase 10);
    # not worth another live round of trial-and-error against real DNS
    # service. Left as the one container in this rollout not hardened —
    # worth a dedicated, careful pass on its own, not squeezed into
    # this batch.
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/admin/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pihole-exporter:
    image: ghcr.io/mosher-labs/pihole6-exporter:latest@sha256:40cccbe332ef8f3b30423b10853fb84cfb4e7613c57717943bc58276990bb085
    container_name: pihole-exporter
    restart: unless-stopped
    networks: [edge]
    command: ["-H", "pihole", "--pihole-port", "80", "--protocol", "http"]
    environment:
      - PIHOLE_API_TOKEN=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
    depends_on:
      - pihole
    # Stateless: reads Pi-hole's API, serves metrics — no local writes,
    # no privileged ports, no reason to be root or hold any capability.
    user: "65534:65534"
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9617/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
