services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:latest@sha256:ab92b7b8fbe63fc0d7affe7ddbbdb9142706f170f98d243a1e0510f864e8a820
    container_name: bambuddy
    restart: unless-stopped
    # Host networking (not the edge bridge network used by every other
    # service here) — required for SSDP printer auto-discovery and the
    # RTSP camera proxy, both of which need L2 multicast/raw port access
    # that a bridge network can't provide.
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=${BAMBUDDY_PORT:-8000}
    volumes:
      - ./data/bambuddy/data:/app/data
      - ./data/bambuddy/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:${BAMBUDDY_PORT:-8000}/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
