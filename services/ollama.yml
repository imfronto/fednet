networks:
  edge:
    external: true

services:
  ollama:
    image: ollama/ollama:latest@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2
    container_name: ollama
    restart: unless-stopped
    networks: [edge]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_PULL_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
    entrypoint: ["/bin/sh", "/ollama_entrypoint.sh"]
    volumes:
      - ./data/ollama:/root/.ollama
      - ./scripts/ollama_entrypoint.sh:/ollama_entrypoint.sh:ro
    # Stays root: model storage under /root/.ollama is already
    # root-owned — switching uid risks breaking access to already
    # -downloaded model blobs for marginal benefit.
    cap_drop:
      - ALL
    read_only: true
    healthcheck:
      # No curl/wget in this image — checking the server process directly.
      test: ["CMD", "pgrep", "-f", "ollama serve"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Sized for a loaded quantized model (llama3.2 3B is ~2GB) plus
          # real headroom, not just today's idle ~24MB.
          memory: 6G
          cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:8afd2d774834c618a75411b3491cdc5da7396dc464f56a160b937ff2992eb6e4
    container_name: open-webui
    restart: unless-stopped
    networks: [edge]
    ports:
      - "${OPENWEBUI_PORT:-8082}:8080"
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - TZ=${TZ:-UTC}
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=fednet AI
      # Open WebUI's own sign-up flow makes the first registered account
      # admin — no separate secret needed here. WEBUI_SECRET_KEY is left
      # unset on purpose so the image generates one instead — but its
      # start.sh defaults that key's file to a path relative to its own
      # working directory (/app/backend), not the bind-mounted data dir,
      # so it never actually survived a container recreate (every
      # recreate silently invalidated all sessions). Read-only rootfs
      # surfaced this as a hard failure instead of a silent one;
      # pointing it at the bind mount fixes the real bug, not just the
      # new error.
      - WEBUI_SECRET_KEY_FILE=/app/backend/data/.webui_secret_key
    volumes:
      - ./data/openwebui:/app/backend/data
    depends_on:
      - ollama
    # Stays root: cache/uploads/vector_db are already root-owned (Phase 6
    # already found this undocumented) — switching uid risks breaking
    # access to a live vector DB for marginal benefit over capability
    # restriction alone.
    cap_drop:
      - ALL
    read_only: true
    # Python's own tempfile module needs a usable temp dir somewhere
    # (uploads, ML processing) — none of its fallback candidates
    # (/tmp, /var/tmp, /usr/tmp, /app/backend) exist as writable
    # without this.
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
