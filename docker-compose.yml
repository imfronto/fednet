networks:
  edge:
    external: true

services:
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: caddy
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    healthcheck:
      # Caddy's own admin API (localhost-only by default) — tests Caddy
      # itself rather than Homepage's health behind it.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # Sits between Homepage and the real Docker socket. Homepage's `:ro`
  # mount on docker.sock only protected the socket *file* — it never
  # scoped the Docker Engine API reachable through it, so any RCE in
  # Homepage was one step from full host root via the daemon. This proxy
  # allow-lists only the GET /containers/* endpoints (list + per-container
  # stats) that Homepage's widgets actually call; everything else,
  # including all mutating calls, stays denied.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks: [edge]
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # No curl/wget/nc symlinked into PATH on this minimal image, but
      # busybox itself bundles them as subcommands. /version is a
      # low-sensitivity Docker Engine endpoint the proxy answers
      # regardless of the CONTAINERS/POST allow-list above, so this stays
      # decoupled from that security-relevant config.
      test: ["CMD", "busybox", "wget", "-qO-", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
    container_name: homepage
    restart: unless-stopped
    networks: [edge]
    depends_on:
      - docker-socket-proxy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      - PUID=${PUID:-1000}
      - TZ=${TZ:-UTC}
      - HOMEPAGE_ALLOWED_HOSTS=localhost,homepage:3000,fednet,fednet:80,lab.lan,lab.lan:80,${TAILSCALE_HOSTNAME:-fednet}
      # Widget credentials, referenced from services.yaml as
      # {{HOMEPAGE_VAR_...}} so nothing secret ends up in the tracked
      # YAML — only .env does. Homepage only substitutes vars with this
      # exact prefix (see substituteEnvironmentVars in its source); a
      # plain ${VAR} in the YAML is never expanded and gets sent as a
      # literal string, which just looks like a silent 401.
      - HOMEPAGE_VAR_PIHOLE_KEY=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      - HOMEPAGE_VAR_PORTAINER_KEY=${PORTAINER_API_KEY:-}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_API_KEY:-}
    volumes:
      - ./homepage:/app/config

  portainer:
    image: portainer/portainer-ce:latest@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa
    container_name: portainer
    restart: unless-stopped
    networks: [edge]
    ports:
      - "9000:9000"
    volumes:
      # Full read-write socket access is Portainer's actual job (container
      # management), unlike Homepage's narrow dashboard-widget need above
      # — not the same finding, left as-is by design.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    # No compose-level healthcheck: the portainer-ce image ships no shell,
    # curl, wget, or nc, and the portainer binary itself has no self-check
    # flag (checked via --help) — there is currently no in-container way
    # to probe it. External monitoring (Uptime Kuma, already deployed)
    # covers this from outside the container instead.
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
