networks:
  edge:
    external: true

services:
  caddy:
    image: caddy:2@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
    container_name: caddy
    restart: unless-stopped
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    healthcheck:
      # Caddy's own admin API (localhost-only by default) — tests Caddy
      # itself rather than Homepage's health behind it.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Official Caddy image doesn't do its own internal privilege drop
    # (unlike several other containers in this stack) — just needs
    # NET_BIND_SERVICE for ports 80/443, no SETUID/SETGID.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Sits between Homepage and the real Docker socket. Homepage's `:ro`
  # mount on docker.sock only protected the socket *file* — it never
  # scoped the Docker Engine API reachable through it, so any RCE in
  # Homepage was one step from full host root via the daemon. This proxy
  # allow-lists only the GET /containers/* endpoints (list + per-container
  # stats) that Homepage's widgets actually call; everything else,
  # including all mutating calls, stays denied.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: docker-socket-proxy
    restart: unless-stopped
    networks: [edge]
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # gid must match the host's docker group (getent group docker) —
    # the socket is root:docker 660, so a non-root reader needs that
    # exact gid, not just any low-privilege uid.
    user: "65534:107"
    cap_drop:
      - ALL
    read_only: true
    # Its own entrypoint generates /tmp/haproxy.cfg from the
    # CONTAINERS/POST env vars at startup, and haproxy itself needs
    # /run for its pidfile — neither documented anywhere obvious,
    # both found by testing. /run needs an explicit mode: Docker's
    # tmpfs default for it is root:root 755, unlike /tmp's standard
    # 1777, so the non-root user here couldn't write to it otherwise.
    tmpfs:
      - /tmp
      - /run:mode=1777
    healthcheck:
      # No curl/wget/nc symlinked into PATH on this minimal image, but
      # busybox itself bundles them as subcommands. /version is a
      # low-sensitivity Docker Engine endpoint the proxy answers
      # regardless of the CONTAINERS/POST allow-list above, so this stays
      # decoupled from that security-relevant config.
      test: ["CMD", "busybox", "wget", "-qO-", "http://127.0.0.1:2375/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest@sha256:da9dca9ec258c628146bed1445da0853f2b88f0b10bafd97c091de807c363d60
    container_name: homepage
    restart: unless-stopped
    networks: [edge]
    depends_on:
      - docker-socket-proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Stays root: ./homepage config dir is fronto:root-owned (tracked
    # git files the user edits directly), and Homepage auto-seeds new
    # template files into it on first boot of an unconfigured
    # integration (Phase 1) — switching uid risks breaking that write.
    # SETUID/SETGID needed: its entrypoint uses su-exec to manage its
    # own PUID-based ownership internally (same pattern as the
    # honeypot/uptime-kuma/bambuddy). Its startup also tries to chown
    # /app/.next (the image's pre-built Next.js production build) and
    # fails under read_only — but that chown attempt already degrades
    # gracefully ("continuing anyway") on its own, so it's left alone
    # rather than given a tmpfs: mounting one over /app/.next would
    # replace the actual pre-built app with an empty directory, which
    # was tried and broke startup outright ("Could not find a
    # production build").
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    read_only: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PUID=${PUID:-1000}
      - TZ=${TZ:-UTC}
      - HOMEPAGE_ALLOWED_HOSTS=localhost,homepage:3000,fednet,fednet:80,lab.lan,lab.lan:80,${TAILSCALE_HOSTNAME:-fednet}
      # Widget credentials, referenced from services.yaml as
      # {{HOMEPAGE_VAR_...}} so nothing secret ends up in the tracked
      # YAML — only .env does. Homepage only substitutes vars with this
      # exact prefix (see substituteEnvironmentVars in its source); a
      # plain ${VAR} in the YAML is never expanded and gets sent as a
      # literal string, which just looks like a silent 401.
      - HOMEPAGE_VAR_PIHOLE_KEY=${PIHOLE_PASSWORD:?set PIHOLE_PASSWORD in .env}
      - HOMEPAGE_VAR_PORTAINER_KEY=${PORTAINER_API_KEY:-}
      - HOMEPAGE_VAR_JELLYFIN_KEY=${JELLYFIN_API_KEY:-}
    volumes:
      - ./homepage:/app/config

  portainer:
    image: portainer/portainer-ce:latest@sha256:511f3f06c96fe3b993ebeaafde311c1959cae73a7ef825dba6397d51b450dffa
    container_name: portainer
    restart: unless-stopped
    networks: [edge]
    ports:
      - "9000:9000"
    volumes:
      # Full read-write socket access is Portainer's actual job (container
      # management), unlike Homepage's narrow dashboard-widget need above
      # — not the same finding, left as-is by design.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    # No compose-level healthcheck: the portainer-ce image ships no shell,
    # curl, wget, or nc, and the portainer binary itself has no self-check
    # flag (checked via --help) — there is currently no in-container way
    # to probe it. External monitoring (Uptime Kuma, already deployed)
    # covers this from outside the container instead.
    # Stays root: /data's internals (portainer.db, bin, certs, chisel,
    # compose) are already root-owned at mode 700/600 — switching uid
    # would break access to its own database. No cap_add needed: unlike
    # Caddy/Pi-hole, it binds no privileged port, and the actual
    # privileged operations happen on the daemon side of the socket,
    # not in this process.
    cap_drop:
      - ALL
    read_only: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
