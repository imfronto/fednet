<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pi-hole Guardian{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
    a { color: #6ea8fe; }
    header { background: #171a21; padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; border-bottom: 1px solid #2a2f3a; }
    header .brand { font-weight: 600; }
    header nav a { color: #b8bfcc; text-decoration: none; margin-right: 1rem; font-size: 0.9rem; }
    header nav a.active { color: #fff; font-weight: 600; }
    main { padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .badge { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 600; }
    .badge.denied, .badge.known_malicious, .badge.strongly_suspicious { background: #4a1e1e; color: #ff8a8a; }
    .badge.allowed, .badge.legitimate_infrastructure, .badge.known_legitimate { background: #1e3a1e; color: #8fe08f; }
    .badge.unlisted, .badge.unknown { background: #2a2e37; color: #b8bfcc; }
    .badge.advertising_tracking, .badge.telemetry_analytics, .badge.potentially_unwanted { background: #4a3a1e; color: #f0c674; }
    .badge.pending { background: #1e2f4a; color: #7fb0ff; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #2a2f3a; font-size: 0.9rem; }
    th { color: #8890a0; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.03em; }
    tr:hover { background: #171a21; }
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .filters a { padding: 0.35rem 0.8rem; border-radius: 1rem; background: #1c2028; text-decoration: none; color: #b8bfcc; font-size: 0.85rem; }
    .filters a.active { background: #35547e; color: #fff; }
    .card { background: #171a21; border: 1px solid #2a2f3a; border-radius: 0.5rem; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .stat { background: #171a21; border: 1px solid #2a2f3a; border-radius: 0.5rem; padding: 0.75rem 1rem; min-width: 140px; }
    .stat .value { font-size: 1.4rem; font-weight: 700; }
    .stat .label { font-size: 0.75rem; color: #8890a0; text-transform: uppercase; }
    form.inline { display: inline; }
    button, input[type=submit] { background: #2a2f3a; color: #e6e6e6; border: 1px solid #3a4050; border-radius: 0.35rem; padding: 0.3rem 0.7rem; cursor: pointer; font-size: 0.85rem; }
    button.danger { background: #4a1e1e; border-color: #6a2e2e; }
    button.primary { background: #1e3a5e; border-color: #2e5a8e; }
    code { background: #1c2028; padding: 0.1rem 0.3rem; border-radius: 0.25rem; }
    ul.evidence-list { margin: 0.25rem 0; padding-left: 1.2rem; }
    .muted { color: #8890a0; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">🛡️ Pi-hole Guardian</div>
    <nav>
      <a href="/" class="{{ 'active' if active_tab == 'dashboard' else '' }}">Domains</a>
      <a href="/review" class="{{ 'active' if active_tab == 'review' else '' }}">Review</a>
      <a href="/changes" class="{{ 'active' if active_tab == 'changes' else '' }}">Changes</a>
      <a href="/incidents" class="{{ 'active' if active_tab == 'incidents' else '' }}">Incidents</a>
      <a href="/protected" class="{{ 'active' if active_tab == 'protected' else '' }}">Protected</a>
    </nav>
    <span class="muted" style="margin-left:auto">mode: <strong>{{ mode }}</strong></span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
