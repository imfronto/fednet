# Curated legitimate-infrastructure domains, grouped by the category
# requirement #4 enumerates. This is evidence AGAINST automatic blocking —
# matching an entry here (exact match or subdomain of it) sets a hard
# protection flag in the decision engine, regardless of any other evidence.
#
# Deliberately conservative: entries are domains that would cause real
# device/service breakage if blocked, not "domains I like." Deliberately
# NOT exhaustive: this is a starting set, meant to be extended locally via
# the protected-domains file (config/protected_domains.yml) rather than
# grown indefinitely here. Do not add entire cloud-provider apex domains
# (amazonaws.com, googleusercontent.com, etc.) — those host both legitimate
# infra AND plenty of malicious/tracking content on the same domain, so a
# blanket match would defeat the point of blocking anything hosted there.

