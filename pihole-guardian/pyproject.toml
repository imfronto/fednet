[project]
name = "pihole-guardian"
version = "0.1.0"
description = "Safety-first automated Pi-hole blocklist/allowlist maintenance service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "typer>=0.12,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "tldextract>=5.1,<6.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
]

[project.scripts]
pihole-guardian = "pihole_guardian.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pihole_guardian = ["db/migrations/*.sql", "resources/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
