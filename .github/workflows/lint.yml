name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on ubuntu-latest runners.
      - run: shellcheck scripts/*.sh

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No real .env in CI (gitignored) — .env.example supplies a
      # placeholder value for every var the compose files require, so
      # `config` can validate structure without real secrets.
      - run: cp .env.example .env
      - run: >
          docker compose
          -f docker-compose.yml
          -f services/bambuddy.yml
          -f services/honeypot.yml
          -f services/jellyfin.yml
          -f services/monitoring.yml
          -f services/ollama.yml
          -f services/pihole.yml
          config --quiet
