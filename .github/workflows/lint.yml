name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on ubuntu-latest runners.
      - run: shellcheck scripts/*.sh

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No real .env in CI (gitignored) — .env.example supplies a
      # placeholder value for every var the compose files require, so
      # `config` can validate structure without real secrets.
      - run: cp .env.example .env
      - run: >
          docker compose
          -f docker-compose.yml
          -f services/bambuddy.yml
          -f services/honeypot.yml
          -f services/jellyfin.yml
          -f services/monitoring.yml
          -f services/ollama.yml
          -f services/pihole.yml
          config --quiet
      # `config` only validates YAML/schema — it never touches the `build:`
      # services (watchdog-base, pihole), so a broken Dockerfile stays
      # invisible until someone deploys it. It has already happened once
      # here silently: a heredoc `RUN` step in pihole/Dockerfile built
      # "successfully" under the legacy (non-BuildKit) builder while
      # actually writing nothing, caught only by inspecting the built
      # image's content directly. This step makes that failure mode loud.
      - run: >
          docker compose
          -f docker-compose.yml
          -f services/bambuddy.yml
          -f services/honeypot.yml
          -f services/jellyfin.yml
          -f services/monitoring.yml
          -f services/ollama.yml
          -f services/pihole.yml
          build
